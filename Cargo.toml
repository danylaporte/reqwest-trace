[package]
name = "reqwest-trace"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
async-cell-lock = { git = "https://github.com/danylaporte/async-cell-lock.git", optional = true }
bytes = "1.12.1"
http = "1.5.0"
metrics = { version = "0.24.6", optional = true }
reqwest = { version = "0.13.5", features = ["form", "native-tls", "query"] }
serde = "1"
serde_json = { version = "1", optional = true }
tokio = { version = "1.53.0", default-features = false, features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }

[features]
async-cell-lock-detect = ["async-cell-lock", "telemetry"]
default = []
json = ["serde_json", "reqwest/json"]
multipart = ["reqwest/multipart"]
telemetry = ["async-cell-lock/telemetry", "metrics"]
